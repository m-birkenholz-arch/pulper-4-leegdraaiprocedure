<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pulper 4 – Leegdraaiprocedure</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#eef2f3}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{min-height:100dvh}.wrap{height:100dvh;max-width:760px;margin:auto;padding:7px;display:flex;flex-direction:column;gap:6px}.head{background:#173f35;color:#fff;padding:9px 12px;border-radius:12px;flex:0 0 auto}.head h1{margin:0;font-size:18px;line-height:1.15}.head p{margin:2px 0 0;font-size:12px;opacity:.9}.statusCard{background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 2px 8px #0001;text-align:center;flex:0 0 auto}.statusCard.due{background:#b42318;color:#fff;animation:pulse 1.5s infinite}.statusCard.soon{background:#fff4d6}.label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.bigTimer{font-size:28px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;margin:3px 0}.dueText{font-size:22px;font-weight:900;margin:3px 0}.meta{font-size:10px;opacity:.8}.statusActions{display:flex;gap:6px;margin-top:5px}.statusActions .btn{flex:1}.progress{height:7px;background:#d6dedb;border-radius:99px;overflow:hidden;margin:6px 0}.bar{height:100%;background:#2b8a63;width:0;transition:.3s}.card{height:100%;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px #0001;display:flex;flex-direction:column;min-height:0}.nr{font-weight:800;color:#2b8a63;text-transform:uppercase;font-size:10px}.card h2{font-size:20px;line-height:1.1;margin:4px 0}.card p{font-size:14px;line-height:1.25;margin:4px 0}.note,.stop{padding:6px 8px;border-radius:7px;margin:5px 0;font-size:11px;line-height:1.2}.note{background:#fff6d8;border-left:4px solid #e2a600}.stop{background:#fde7e7;border-left:4px solid #b42318;font-weight:650}.actions{display:flex;gap:6px;margin-top:auto;padding-top:6px}.btn{border:0;border-radius:9px;padding:9px 10px;font-size:13px;font-weight:750;cursor:pointer;min-height:38px}.primary{background:#21875e;color:#fff;flex:1}.secondary{background:#dfe5e3;color:#233}.outline{background:#fff;border:1px solid #b7c3bf;color:#344}.hidden{display:none!important}.procTop{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#52635d}.procedure{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}.procedure .card{flex:1}.procedure>.outline{flex:0 0 auto;padding:6px;min-height:30px;font-size:11px}.history{background:#fff;border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px #0001;flex:0 0 auto}.history h3{display:none}.historyRow{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyRow:not(:first-child){display:none}.safety{font-size:9px;line-height:1.15;color:#5c6b66;padding:0 3px 2px;flex:0 0 auto}.alarmBtn{background:#fff;color:#173f35;border:1px solid #b7c3bf}@keyframes pulse{50%{filter:brightness(.82)}}
@media(max-height:650px){.head p,.history,.safety{display:none}.head{padding:7px 10px}.statusCard{padding:6px 10px}.card h2{font-size:18px}.card p{font-size:12px}.note,.stop{font-size:10px;padding:5px 7px}.btn{min-height:34px;padding:7px 9px}}
</style></head><body><main class="wrap">
<section class="head"><h1>Pulper 4 · Leegdraaiprocedure</h1><p>1× per uur · rejects verwijderen via de Poire</p></section>
<section id="statusCard" class="statusCard"><div id="statusLabel" class="label">Status</div><div id="timerDisplay" class="bigTimer">—</div><div id="statusMeta" class="meta"></div><div class="statusActions"><button id="startBtn" class="btn primary" onclick="startProcedure()">Start leegdraaiprocedure</button><button id="alarmBtn" class="btn alarmBtn" onclick="enableAlarm()">🔔 Alarm</button></div></section>
<section id="procedure" class="procedure hidden"><div class="card"><div class="procTop"><span id="stepCount"></span><span id="elapsed"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="stepBody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div><button class="btn outline" onclick="restartProcedure()">↺ Opnieuw bij stap 1</button></section>
<section id="historyBox" class="history"><h3>Laatste leegdraai</h3><div id="history"></div></section>
<div class="safety">Gebruik alleen samen met de goedgekeurde lokale werk- en veiligheidsinstructie. Bij afwijking of onveilige situatie: stop en volg de geldende procedure.</div>
</main>
<script>
const steps=[['Water eraf','Laat het waterniveau zakken. Indien nodig eerst water erop zetten om gecontroleerd af te voeren.'],['Niveau kuip 19 op 99%','Zet niveau kuip 19 op 99% (standaard 90%).'],['Operations op 999','Zet Operations op 999 en laat circa 300 seconden meedraaien.'],['Legen in 19','Selecteer Legen in 19 op bedieningsscherm P4.'],['Wassen','Start Wassen; de stappen lopen weer door.'],['Operations terug op 90','Zet Operations weer op 90.'],['Drainklep handmatig','Zet drainklep op handmatig en zet Poire op rust.'],['Waterklep open','Open waterklep P4 tot pulp waterig wordt en voer water af. Bij laag niveau: Cyclo uit indien gebruikt en knop 19 uitzetten.'],['Vullen dicht / legen in tank','Controleer dat Vullen dicht staat. Zet Legen in tank.'],['Water erop','Voeg weer water toe.'],['Halverwege stoppen','Stop halverwege en zet Legen in tank uit. Als het nog niet waterig genoeg is: doorgaan tot het minimumniveau in de pulper.'],['Weer water erop','Voeg opnieuw water toe. Niveau linker plaat is goed; minimaal lasnaad Pulper 4.'],['Water eraf','Voer het water af.'],['Inlaatklep Poire open','Open de inlaatklep van de Poire en controleer of alles weg is.'],['Inlaatklep dicht','Zet inlaatklep dicht (auto).'],['Drainklep dicht','Zet drainklep dicht (auto).'],['Niveau Pulper 4 op 90%','Zet niveau Pulper 4 weer op 90% (parameter 1 scherm).'],['Water erop','Voeg water toe. Zet Cyclo weer aan indien hiermee wordt gedraaid.'],['Vullen vanuit tank','Zet vullen aan van de tank naar Pulper 4.'],['Vullen met papier/balen','Start band en vul met papier/balen.'],['Beginnen met wassen','Begin met wassen en zet Poire in de normale bedrijfsstand.']];
const KEY='pulper4_v2_state';let state=load();let audioEnabled=false,alarmPlayed=false;
function load(){try{return Object.assign({active:false,step:0,startedAt:0,lastCompletedAt:0,nextDueAt:0,history:[]},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{active:false,step:0,startedAt:0,lastCompletedAt:0,nextDueAt:0,history:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function fmtDate(t){return t?new Intl.DateTimeFormat('nl-NL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(t)):'Nog niet uitgevoerd'}function fmtDuration(ms){let s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);s%=60;return `${m}:${String(s).padStart(2,'0')}`}
function startProcedure(){if(!state.active){state.active=true;state.step=0;state.startedAt=Date.now();save()}render()}function restartProcedure(){if(confirm('Opnieuw beginnen bij stap 1? De uurtimer wordt pas opnieuw ingesteld als alle 21 stappen zijn afgerond.')){state.active=true;state.step=0;state.startedAt=Date.now();save();render()}}function completeStep(){state.step++;if(state.step>=steps.length){const now=Date.now(),duration=now-state.startedAt;state.history.unshift({completedAt:now,duration});state.history=state.history.slice(0,10);state.lastCompletedAt=now;state.nextDueAt=now+3600000;state.active=false;state.step=0;state.startedAt=0;alarmPlayed=false;save()}else save();render()}function previous(){if(state.step>0){state.step--;save();render()}}function enableAlarm(){audioEnabled=true;document.getElementById('alarmBtn').textContent='🔔 Actief';beep(.05)}function beep(volume=.18){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=volume;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
function renderStep(){const p=document.getElementById('procedure');if(!state.active){p.classList.add('hidden');return}p.classList.remove('hidden');const s=steps[state.step];document.getElementById('stepCount').textContent=`Stap ${state.step+1} van ${steps.length}`;document.getElementById('bar').style.width=`${state.step/steps.length*100}%`;document.getElementById('stepBody').innerHTML=`<div class="nr">Stap ${state.step+1}</div><h2>${s[0]}</h2><p>${s[1]}</p>${[6,7,13,14,15].includes(state.step)?'<div class="note"><strong>Controlepunt:</strong> controleer klepstand en procesconditie vóór je verdergaat.</div>':''}<div class="stop">Stop bij een onverwachte of onveilige procesconditie en volg de lokale installatie-instructies.</div><div class="actions">${state.step?'<button class="btn secondary" onclick="previous()">← Vorige</button>':''}<button class="btn primary" onclick="completeStep()">✓ Uitgevoerd</button></div>`}
function renderHistory(){const h=document.getElementById('history');if(!state.history.length){h.innerHTML='<div class="meta">Nog geen afgeronde leegdraai op dit apparaat.</div>';return}h.innerHTML=state.history.slice(0,3).map((x,i)=>`<div class="historyRow">${i===0?'<strong>Laatste: </strong>':''}${fmtDate(x.completedAt)} · duur ${fmtDuration(x.duration)}</div>`).join('')}
function updateClock(){const card=document.getElementById('statusCard'),label=document.getElementById('statusLabel'),timer=document.getElementById('timerDisplay'),meta=document.getElementById('statusMeta'),btn=document.getElementById('startBtn');card.classList.remove('due','soon');if(state.active){label.textContent='Procedure bezig';timer.className='bigTimer';timer.textContent=`Stap ${state.step+1} / ${steps.length}`;meta.textContent=`Gestart ${fmtDate(state.startedAt)}`;btn.textContent='Bezig';btn.onclick=()=>{};document.getElementById('elapsed').textContent=`Duur ${fmtDuration(Date.now()-state.startedAt)}`;return}btn.onclick=startProcedure;if(!state.nextDueAt){label.textContent='Nog geen timer actief';timer.className='bigTimer';timer.textContent='60:00';meta.textContent='Timer start na stap 21.';btn.textContent='Start leegdraaiprocedure';return}const d=state.nextDueAt-Date.now();if(d<=0){card.classList.add('due');label.textContent='Actie vereist';timer.className='dueText';timer.textContent='LEEGDRAAI NODIG';meta.textContent=`Gepland vanaf ${fmtDate(state.nextDueAt)}`;btn.textContent='Start leegdraaiprocedure';if(audioEnabled&&!alarmPlayed){beep();setTimeout(()=>beep(),500);alarmPlayed=true}return}timer.className='bigTimer';if(d<=600000)card.classList.add('soon');const total=Math.ceil(d/1000),m=Math.floor(total/60),s=total%60;label.textContent='Volgende leegdraai over';timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;meta.textContent=`Laatste: ${fmtDate(state.lastCompletedAt)}`}
function render(){renderStep();renderHistory();updateClock()}render();setInterval(updateClock,1000);
</script></body></html>
