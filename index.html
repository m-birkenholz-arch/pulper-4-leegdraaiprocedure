<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulper 4 – Leegdraaiprocedure</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#eef2f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:12px}.head{background:#173f35;color:#fff;padding:9px 14px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:20px;line-height:1.15}.head p{margin:0;font-size:12px;opacity:.9;text-align:right;white-space:nowrap}.statusCard{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px #0001;text-align:center}.statusCard.due{background:#b42318;color:#fff;animation:pulse 1.5s infinite}.statusCard.soon{background:#fff4d6}.label{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.bigTimer{font-size:48px;line-height:1.05;font-weight:900;font-variant-numeric:tabular-nums;margin:8px 0}.dueText{font-size:31px;font-weight:900;margin:8px 0}.meta{font-size:14px;opacity:.8}.progress{height:12px;background:#d6dedb;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#2b8a63;width:0;transition:.3s}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 18px #0001}.nr{font-weight:800;color:#2b8a63;text-transform:uppercase;font-size:13px}.card h2{font-size:24px;margin:8px 0}.note{background:#fff6d8;border-left:5px solid #e2a600;padding:12px;border-radius:8px;margin:14px 0}.stop{background:#fde7e7;border-left:5px solid #b42318;padding:12px;border-radius:8px;margin:14px 0;font-weight:700}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:750;cursor:pointer}.primary{background:#21875e;color:#fff;flex:1}.secondary{background:#dfe5e3;color:#233}.outline{background:#fff;border:1px solid #b7c3bf;color:#344;width:100%;margin-top:10px}.hidden{display:none}.procTop{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#52635d}.history{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 5px 18px #0001}.history h3{margin:0 0 10px}.historyRow{padding:8px 0;border-top:1px solid #e5e9e7;font-size:14px}.safety{font-size:13px;color:#5c6b66;padding:14px 4px}.alarmBtn{background:#fff;color:#173f35;border:1px solid #b7c3bf;margin-top:10px}@keyframes pulse{50%{filter:brightness(.82)}}@media(max-width:560px){.wrap{padding:9px}.head{padding:8px 11px;border-radius:11px;margin-bottom:9px}.head h1{font-size:17px}.head p{font-size:10px}.bigTimer{font-size:44px}.card{padding:17px}.card h2{font-size:25px}.btn{min-height:56px;font-size:17px}.actions{flex-direction:column-reverse}}
</style></head><body><main class="wrap">
<section class="head"><h1>Pulper 4 · Leegdraaiprocedure</h1><p>1× per uur · rejects via Poire</p></section>
<section id="statusCard" class="statusCard"><div id="statusLabel" class="label">Status</div><div id="timerDisplay" class="bigTimer">—</div><div id="statusMeta" class="meta"></div><button id="startBtn" class="btn primary" onclick="startProcedure()">Start leegdraaiprocedure</button><button id="alarmBtn" class="btn alarmBtn" onclick="enableAlarm()">🔔 Alarmgeluid inschakelen</button></section>
<section id="procedure" class="hidden"><div class="card"><div class="procTop"><span id="stepCount"></span><span id="elapsed"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="stepBody"></div></div><button class="btn outline" onclick="restartProcedure()">Nu opnieuw starten bij stap 1</button></section>
<section class="history"><h3>Laatste leegdraai</h3><div id="history"></div></section>
<div class="safety">Gebruik deze checklist alleen in combinatie met de goedgekeurde lokale werkinstructie en veiligheidsprocedures. Bij een afwijkende of onveilige procesconditie: stop en volg de geldende installatieprocedure.</div>
</main><script>
const steps=[['Water eraf','Laat het waterniveau zakken. Indien nodig eerst water erop zetten om gecontroleerd af te voeren.'],['Niveau kuip 19 op 99%','Zet niveau kuip 19 op 99% (standaard 90%).'],['Operations op 999','Zet Operations op 999 en laat circa 300 seconden meedraaien.'],['Legen in 19','Selecteer Legen in 19 op bedieningsscherm P4.'],['Wassen','Start Wassen; de stappen lopen weer door.'],['Operations terug op 90','Zet Operations weer op 90.'],['Drainklep handmatig','Zet drainklep op handmatig en zet Poire op rust.'],['Waterklep open','Open waterklep P4 tot pulp waterig wordt en voer water af. Bij laag niveau: Cyclo uit indien gebruikt en knop 19 uitzetten.'],['Vullen dicht / legen in tank','Controleer dat Vullen dicht staat. Zet Legen in tank.'],['Water erop','Voeg weer water toe.'],['Halverwege stoppen','Stop halverwege en zet Legen in tank uit. Als het nog niet waterig genoeg is: doorgaan tot het minimumniveau in de pulper.'],['Weer water erop','Voeg opnieuw water toe. Niveau linker plaat is goed; minimaal lasnaad Pulper 4.'],['Water eraf','Voer het water af.'],['Inlaatklep Poire open','Open de inlaatklep van de Poire en controleer of alles weg is.'],['Inlaatklep dicht','Zet inlaatklep dicht (auto).'],['Drainklep dicht','Zet drainklep dicht (auto).'],['Niveau Pulper 4 op 90%','Zet niveau Pulper 4 weer op 90% (parameter 1 scherm).'],['Water erop','Voeg water toe. Zet Cyclo weer aan indien hiermee wordt gedraaid.'],['Vullen vanuit tank','Zet vullen aan van de tank naar Pulper 4.'],['Vullen met papier/balen','Start band en vul met papier/balen.'],['Beginnen met wassen','Begin met wassen en zet Poire in de normale bedrijfsstand.']];
const KEY='pulper4_v2_state';let state=load(),audioEnabled=false,alarmPlayed=false;function load(){try{return Object.assign({active:false,step:0,startedAt:0,lastCompletedAt:0,nextDueAt:0,history:[]},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{active:false,step:0,startedAt:0,lastCompletedAt:0,nextDueAt:0,history:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function fmtDate(t){return t?new Intl.DateTimeFormat('nl-NL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(t)):'Nog niet uitgevoerd'}function fmtDuration(ms){let s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);s%=60;return `${m}:${String(s).padStart(2,'0')}`}function startProcedure(){if(!state.active){state.active=true;state.step=0;state.startedAt=Date.now();save()}render()}function restartProcedure(){if(confirm('Opnieuw beginnen bij stap 1? De uurtimer wordt pas opnieuw ingesteld als alle 21 stappen zijn afgerond.')){state.active=true;state.step=0;state.startedAt=Date.now();save();render();scrollTo({top:0,behavior:'smooth'})}}function completeStep(){state.step++;if(state.step>=steps.length){const now=Date.now(),duration=now-state.startedAt;state.history.unshift({completedAt:now,duration});state.history=state.history.slice(0,10);state.lastCompletedAt=now;state.nextDueAt=now+3600000;state.active=false;state.step=0;state.startedAt=0;alarmPlayed=false;save()}else save();render();scrollTo({top:0,behavior:'smooth'})}function previous(){if(state.step>0){state.step--;save();render()}}function enableAlarm(){audioEnabled=true;document.getElementById('alarmBtn').textContent='🔔 Alarmgeluid actief';beep(.05)}function beep(volume=.18){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=volume;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}function renderStep(){const p=document.getElementById('procedure');if(!state.active){p.classList.add('hidden');return}p.classList.remove('hidden');const s=steps[state.step];document.getElementById('stepCount').textContent=`Stap ${state.step+1} van ${steps.length}`;document.getElementById('bar').style.width=`${state.step/steps.length*100}%`;document.getElementById('stepBody').innerHTML=`<div class="nr">Stap ${state.step+1}</div><h2>${s[0]}</h2><p>${s[1]}</p>${[6,7,13,14,15].includes(state.step)?'<div class="note"><strong>Controlepunt:</strong> controleer de werkelijke klepstand en procesconditie vóór je verdergaat.</div>':''}<div class="stop">Stop bij een onverwachte procesconditie of onveilige situatie en volg de lokale installatie-instructies.</div><div class="actions">${state.step?'<button class="btn secondary" onclick="previous()">← Vorige</button>':''}<button class="btn primary" onclick="completeStep()">✓ Handeling uitgevoerd</button></div>`}function renderHistory(){const h=document.getElementById('history');if(!state.history.length){h.innerHTML='<div class="meta">Nog geen afgeronde leegdraai geregistreerd op dit apparaat.</div>';return}h.innerHTML=state.history.slice(0,3).map((x,i)=>`<div class="historyRow">${i===0?'<strong>Laatste: </strong>':''}${fmtDate(x.completedAt)} · duur ${fmtDuration(x.duration)}</div>`).join('')}function updateClock(){const card=document.getElementById('statusCard'),label=document.getElementById('statusLabel'),timer=document.getElementById('timerDisplay'),meta=document.getElementById('statusMeta'),btn=document.getElementById('startBtn');card.classList.remove('due','soon');if(state.active){label.textContent='Procedure bezig';timer.className='bigTimer';timer.textContent=`Stap ${state.step+1} / ${steps.length}`;meta.textContent=`Gestart ${fmtDate(state.startedAt)}`;btn.textContent='Procedure hervatten';btn.onclick=()=>document.getElementById('procedure').scrollIntoView({behavior:'smooth'});document.getElementById('elapsed').textContent=`Duur ${fmtDuration(Date.now()-state.startedAt)}`;return}btn.onclick=startProcedure;if(!state.nextDueAt){label.textContent='Nog geen timer actief';timer.className='bigTimer';timer.textContent='60:00';meta.textContent='De uurtimer start na het afronden van stap 21.';btn.textContent='Start leegdraaiprocedure';return}const d=state.nextDueAt-Date.now();if(d<=0){card.classList.add('due');label.textContent='Actie vereist';timer.className='dueText';timer.textContent='LEEGDRAAI NODIG';meta.textContent=`Gepland vanaf ${fmtDate(state.nextDueAt)}`;btn.textContent='Start leegdraaiprocedure';if(audioEnabled&&!alarmPlayed){beep();setTimeout(()=>beep(),500);alarmPlayed=true}return}timer.className='bigTimer';if(d<=600000)card.classList.add('soon');const total=Math.ceil(d/1000),m=Math.floor(total/60),s=total%60;label.textContent='Volgende leegdraai over';timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;meta.textContent=`Laatste afgerond: ${fmtDate(state.lastCompletedAt)}`}function render(){renderStep();renderHistory();updateClock()}render();setInterval(updateClock,1000);
</script></body></html>
