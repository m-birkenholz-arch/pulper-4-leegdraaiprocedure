<!doctype html><html lang='nl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Pulper 4 – Leegdraaiprocedure</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#eef2f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.head{background:#173f35;color:white;padding:22px;border-radius:18px;margin-bottom:14px}.head h1{margin:0 0 6px;font-size:27px}.head p{margin:0;opacity:.9}.progress{height:12px;background:#d6dedb;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#2b8a63;width:0;transition:.3s}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 18px #0001}.nr{font-weight:800;color:#2b8a63;text-transform:uppercase;font-size:13px}.card h2{font-size:22px;margin:8px 0}.note{background:#fff6d8;border-left:5px solid #e2a600;padding:12px;border-radius:8px;margin:14px 0}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer}.done{background:#21875e;color:#fff;flex:1}.back{background:#dfe5e3}.reset{background:#fff;border:1px solid #b7c3bf;color:#344;margin-top:14px;width:100%}.finish{text-align:center;padding:25px}.small{font-size:14px;color:#5c6b66;margin-top:12px}.danger{color:#8b1d1d;font-weight:700}.check{font-size:48px}.timer{font-variant-numeric:tabular-nums;font-weight:800}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.status>div{background:#fff;border-radius:14px;padding:12px;color:#173f35}.status b{display:block;font-size:20px}.stop{background:#fde7e7;border-left:5px solid #b42318;padding:12px;border-radius:8px;margin:14px 0;font-weight:700}@media(max-width:560px){.wrap{padding:10px}.head{border-radius:14px;padding:17px}.head h1{font-size:23px}.card{padding:17px}.card h2{font-size:25px}.btn{min-height:58px;font-size:18px}.actions{flex-direction:column-reverse}.status{grid-template-columns:1fr}}</style></head><body><main class='wrap'><section class='head'><h1>Pulper 4 · Leegdraaiprocedure</h1><p>1× per uur · rejects verwijderen via de Poire</p><div class='status'><div>Voortgang<b id='statusStep'>—</b></div><div>Volgende leegdraai<b class='timer' id='hourTimer'>na afronding</b></div></div><div class='progress'><div class='bar' id='bar'></div></div><div id='count'></div></section><section class='card' id='card'></section><button class='btn reset' onclick='resetProc()'>Procedure opnieuw starten</button></main><script>const steps=[['Water eraf','Laat het waterniveau zakken. Indien nodig eerst water erop zetten om gecontroleerd af te voeren.'],['Niveau kuip 19 op 99%','Zet niveau kuip 19 op 99% (standaard 90%).'],['Operations op 999','Zet Operations op 999 en laat circa 300 seconden meedraaien.'],['Legen in 19','Selecteer Legen in 19 op bedieningsscherm P4.'],['Wassen','Start Wassen; de stappen lopen weer door.'],['Operations terug op 90','Zet Operations weer op 90.'],['Drainklep handmatig','Zet drainklep op handmatig en zet Poire op rust.'],['Waterklep open','Open waterklep P4 tot pulp waterig wordt en voer water af. Bij laag niveau: Cyclo uit indien gebruikt en knop 19 uitzetten.'],['Vullen dicht / legen in tank','Controleer dat Vullen dicht staat. Zet Legen in tank.'],['Water erop','Voeg weer water toe.'],['Halverwege stoppen','Stop halverwege en zet Legen in tank uit. Als het nog niet waterig genoeg is: doorgaan tot het minimumniveau in de pulper.'],['Weer water erop','Voeg opnieuw water toe. Niveau linker plaat is goed; minimaal lasnaad Pulper 4.'],['Water eraf','Voer het water af.'],['Inlaatklep Poire open','Open de inlaatklep van de Poire en controleer of alles weg is.'],['Inlaatklep dicht','Zet inlaatklep dicht (auto).'],['Drainklep dicht','Zet drainklep dicht (auto).'],['Niveau Pulper 4 op 90%','Zet niveau Pulper 4 weer op 90% (parameter 1 scherm).'],['Water erop','Voeg water toe. Zet Cyclo weer aan indien hiermee wordt gedraaid.'],['Vullen vanuit tank','Zet vullen aan van de tank naar Pulper 4.'],['Vullen met papier/balen','Start band en vul met papier/balen.'],['Beginnen met wassen','Begin met wassen en zet Poire in de normale bedrijfsstand.']];let i=Number(localStorage.getItem('p4step')||0);let nextDue=Number(localStorage.getItem('p4nextDue')||0);const card=document.getElementById('card'),bar=document.getElementById('bar'),count=document.getElementById('count'),statusStep=document.getElementById('statusStep'),hourTimer=document.getElementById('hourTimer');function render(){if(i>=steps.length){card.innerHTML=`<div class='finish'><div class='check'>✓</div><h2>Leegdraaiprocedure afgerond</h2><p>De volgende leegdraai staat gepland over één uur.</p><p class='small'>Laat de installatie alleen terug in bedrijf gaan volgens de geldende lokale werk- en veiligheidsinstructies.</p></div>`;bar.style.width='100%';count.textContent='21 van 21 afgerond';statusStep.textContent='21 / 21';return}let s=steps[i];card.innerHTML=`<div class='nr'>Stap ${i+1}</div><h2>${s[0]}</h2><p>${s[1]}</p>${[6,7,13,14,15].includes(i)?`<div class='note'><strong>Controlepunt:</strong> controleer de werkelijke klepstand en procesconditie vóór je verdergaat.</div>`:''}<div class='stop'>Stop bij een onverwachte procesconditie of onveilige situatie en volg de lokale installatie-instructies.</div><div class='actions'>${i?`<button class='btn back' onclick='prev()'>← Vorige</button>`:''}<button class='btn done' onclick='done()'>✓ Handeling uitgevoerd</button></div>`;bar.style.width=(i/steps.length*100)+'%';count.textContent=`Stap ${i+1} van ${steps.length}`;statusStep.textContent=`${i+1} / ${steps.length}`}function done(){i++;localStorage.setItem('p4step',i);if(i>=steps.length){nextDue=Date.now()+3600000;localStorage.setItem('p4nextDue',nextDue);localStorage.setItem('p4lastDone',Date.now())}render();updateTimer();scrollTo({top:0,behavior:'smooth'})}function prev(){if(i>0){i--;localStorage.setItem('p4step',i);render()}}function resetProc(){if(confirm('Procedure opnieuw bij stap 1 starten?')){i=0;localStorage.setItem('p4step',0);render();scrollTo({top:0,behavior:'smooth'})}}function updateTimer(){if(!nextDue){hourTimer.textContent='na afronding';return}let d=nextDue-Date.now();if(d<=0){hourTimer.textContent='LEEGDRAAI NODIG';hourTimer.classList.add('danger');return}hourTimer.classList.remove('danger');let m=Math.floor(d/60000),s=Math.floor((d%60000)/1000);hourTimer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}render();updateTimer();setInterval(updateTimer,1000);</script></body></html>
